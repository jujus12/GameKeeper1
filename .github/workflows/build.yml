name: Build GameKeeper APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Build debug APK
        run: ./gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GameKeeper1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameKeeper1-debug-apk
          path: GameKeeper1.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameKeeper build ${{ github.run_number }}
          files: GameKeeper1.apk
